
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: nftbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      POSTGRES_DB: nftbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nftbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: always
    command: sh scripts/start.sh bot
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nftbot:${POSTGRES_PASSWORD:-change_this_password}@db:5432/nftbot
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: always
    command: sh scripts/start.sh worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nftbot:${POSTGRES_PASSWORD:-change_this_password}@db:5432/nftbot
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
